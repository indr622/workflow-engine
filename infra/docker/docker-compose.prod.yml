# Deployment: engine + web + postgres dari image Docker.
# Jalankan: make deploy-local   (atau di server: docker compose -f infra/docker/docker-compose.prod.yml --env-file .env.prod up -d)
name: workflow-engine

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi}
      POSTGRES_DB: ${POSTGRES_DB:-workflow}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  engine:
    image: ${REGISTRY:-ghcr.io/indr622/workflow-engine}/engine:${VERSION:-latest}
    restart: unless-stopped
    environment:
      ENGINE_HTTP_ADDR: ':8080'
      DATABASE_URL: postgres://${POSTGRES_USER:-workflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-workflow}?sslmode=disable
      ENGINE_MIGRATE: 'true'
      ENGINE_LOG_LEVEL: ${ENGINE_LOG_LEVEL:-info}
      ENGINE_CORS_ORIGINS: ${ENGINE_CORS_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ${REGISTRY:-ghcr.io/indr622/workflow-engine}/web:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8088}:80'
    depends_on:
      engine:
        condition: service_healthy

volumes:
  postgres-data:
