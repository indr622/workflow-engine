# Dependensi pengembangan lokal. Engine dan web dijalankan native lewat `make dev`.
# Jalankan: make up   (profil tambahan: make up PROFILES="tools observability")
name: workflow-engine-dev

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workflow}
      POSTGRES_DB: ${POSTGRES_DB:-workflow}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      # Target dump `make db-backup` (docs/ops/backup-restore.md).
      - postgres-backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  pgweb:
    image: sosedoff/pgweb:latest
    profiles: ['tools']
    environment:
      PGWEB_DATABASE_URL: postgres://${POSTGRES_USER:-workflow}:${POSTGRES_PASSWORD:-workflow}@postgres:5432/${POSTGRES_DB:-workflow}?sslmode=disable
    ports:
      - '127.0.0.1:${PGWEB_PORT:-8081}:8081'
    depends_on:
      postgres:
        condition: service_healthy

  # Camunda 8.8 referensi untuk uji paritas (make up PROFILES=camunda). Bukan bagian runtime.
  zeebe:
    image: camunda/zeebe:8.8.44
    profiles: ['camunda']
    environment:
      ZEEBE_BROKER_GATEWAY_ENABLE: 'true'
      # Tanpa penyimpanan sekunder (Elasticsearch); cukup broker + REST untuk uji deploy.
      CAMUNDA_DATA_SECONDARYSTORAGE_TYPE: 'none'
      CAMUNDA_SECURITY_AUTHENTICATION_UNPROTECTEDAPI: 'true'
      CAMUNDA_SECURITY_AUTHORIZATIONS_ENABLED: 'false'
      ZEEBE_BROKER_DATA_DISKUSAGECOMMANDWATERMARK: '0.98'
      ZEEBE_BROKER_DATA_DISKUSAGEREPLICATIONWATERMARK: '0.99'
      JAVA_TOOL_OPTIONS: '-Xms512m -Xmx1g'
    ports:
      - '127.0.0.1:${ZEEBE_GRPC_PORT:-26500}:26500'
      - '127.0.0.1:${ZEEBE_REST_PORT:-8089}:8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9600/actuator/health/status >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    profiles: ['observability']
    ports:
      - '127.0.0.1:4317:4317'
      - '127.0.0.1:4318:4318'

volumes:
  postgres-data:
  postgres-backups:
