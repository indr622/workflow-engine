syntax = "proto3";

package workflow.process.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/indr622/workflow-engine/libs/go/api/gen/workflow/process/v1;processv1";

// Semua key (field berakhiran _key) adalah UUIDv7 dalam bentuk kanonik huruf kecil (ADR-0011).

// ProcessInstanceService membuat, membaca, dan membatalkan process instance.
service ProcessInstanceService {
  // CreateProcessInstance menjalankan versi proses yang dipilih sampai semua token berhenti di
  // wait state atau selesai. Instance tanpa wait state sudah COMPLETED saat respons dikirim.
  rpc CreateProcessInstance(CreateProcessInstanceRequest) returns (CreateProcessInstanceResponse) {}
  // GetProcessInstance mengembalikan instance beserta seluruh element instance, variabel,
  // incident, dan job-nya.
  rpc GetProcessInstance(GetProcessInstanceRequest) returns (GetProcessInstanceResponse) {}
  // ListProcessInstances mengembalikan daftar instance terbaru dahulu dengan keyset pagination.
  rpc ListProcessInstances(ListProcessInstancesRequest) returns (ListProcessInstancesResponse) {}
  // CancelProcessInstance menghentikan semua element instance aktif dan membatalkan job terbuka.
  rpc CancelProcessInstance(CancelProcessInstanceRequest) returns (CancelProcessInstanceResponse) {}
  // ListProcessInstanceRecords mengembalikan record append-only instance urut sequence, berhalaman.
  rpc ListProcessInstanceRecords(ListProcessInstanceRecordsRequest) returns (ListProcessInstanceRecordsResponse) {}
  // ListElementInstances mengembalikan element instance urut key, berhalaman.
  rpc ListElementInstances(ListElementInstancesRequest) returns (ListElementInstancesResponse) {}
}

message CreateProcessInstanceRequest {
  oneof definition {
    // Key versi process definition tertentu.
    string process_definition_key = 1;
    // bpmnProcessId dengan versi tertentu atau terbaru.
    ProcessDefinitionRef bpmn_process = 2;
  }
  // Dokumen JSON object; kosong berarti tanpa variabel.
  string variables = 3;
  // Opsional, 1 sampai 128 byte. Request dengan request_id yang sama dalam masa berlaku
  // (ENGINE_IDEMPOTENCY_TTL) dijalankan sekali; ulangan mendapat response yang sama.
  string request_id = 4;
}

message ProcessDefinitionRef {
  string bpmn_process_id = 1;
  // 0 berarti versi terbaru.
  int32 version = 2;
}

message CreateProcessInstanceResponse {
  string process_instance_key = 1;
  string process_definition_key = 2;
  string bpmn_process_id = 3;
  int32 version = 4;
  // State instance setelah command pertama selesai diproses.
  ProcessInstanceState state = 5;
}

message GetProcessInstanceRequest {
  string process_instance_key = 1;
}

message GetProcessInstanceResponse {
  ProcessInstance process_instance = 1;
  // Termasuk element instance yang sudah final, urut key.
  repeated ElementInstance element_instances = 2;
  repeated Variable variables = 3;
  repeated Incident incidents = 4;
  repeated Job jobs = 5;
  // True bila element instance lebih dari 1.000 dan dipotong; pakai ListElementInstances.
  bool element_instances_truncated = 6;
}

message ProcessInstance {
  string process_instance_key = 1;
  string process_definition_key = 2;
  string bpmn_process_id = 3;
  int32 version = 4;
  ProcessInstanceState state = 5;
  bool has_incident = 6;
  google.protobuf.Timestamp start_time = 7;
  google.protobuf.Timestamp end_time = 8;
}

enum ProcessInstanceState {
  PROCESS_INSTANCE_STATE_UNSPECIFIED = 0;
  PROCESS_INSTANCE_STATE_ACTIVE = 1;
  PROCESS_INSTANCE_STATE_COMPLETED = 2;
  PROCESS_INSTANCE_STATE_TERMINATED = 3;
}

message ElementInstance {
  string element_instance_key = 1;
  // Kosong untuk element instance PROCESS.
  string flow_scope_key = 2;
  string element_id = 3;
  // Nama tipe Zeebe, misalnya "SERVICE_TASK" atau "EXCLUSIVE_GATEWAY".
  string bpmn_element_type = 4;
  ElementInstanceState state = 5;
  // Incident terbuka yang menahan elemen ini, kosong bila tidak ada.
  string incident_key = 6;
  google.protobuf.Timestamp start_time = 7;
  google.protobuf.Timestamp end_time = 8;
}

enum ElementInstanceState {
  ELEMENT_INSTANCE_STATE_UNSPECIFIED = 0;
  ELEMENT_INSTANCE_STATE_ACTIVATING = 1;
  ELEMENT_INSTANCE_STATE_ACTIVATED = 2;
  ELEMENT_INSTANCE_STATE_COMPLETING = 3;
  ELEMENT_INSTANCE_STATE_COMPLETED = 4;
  ELEMENT_INSTANCE_STATE_TERMINATING = 5;
  ELEMENT_INSTANCE_STATE_TERMINATED = 6;
}

message Variable {
  string scope_key = 1;
  string name = 2;
  // Nilai JSON.
  string value = 3;
}

message Incident {
  string incident_key = 1;
  string element_instance_key = 2;
  string element_id = 3;
  // Misalnya "CONDITION_ERROR" atau "EXTRACT_VALUE_ERROR".
  string error_type = 4;
  string error_message = 5;
  bool resolved = 6;
  google.protobuf.Timestamp created_at = 7;
}

message Job {
  string job_key = 1;
  string type = 2;
  string element_id = 3;
  string element_instance_key = 4;
  int32 retries = 5;
  // CREATED, COMPLETED, atau CANCELED. Menjadi enum di Fase 4.
  string state = 6;
}

message ListProcessInstancesRequest {
  string bpmn_process_id = 1;
  string process_definition_key = 2;
  ProcessInstanceState state = 3;
  bool only_with_incident = 4;
  // Default 50, maksimum 500.
  int32 page_size = 5;
  string page_token = 6;
}

message ListProcessInstancesResponse {
  repeated ProcessInstance process_instances = 1;
  string next_page_token = 2;
}

message CancelProcessInstanceRequest {
  string process_instance_key = 1;
  // Opsional, 1 sampai 128 byte. Request dengan request_id yang sama dalam masa berlaku
  // (ENGINE_IDEMPOTENCY_TTL) dijalankan sekali; ulangan mendapat response yang sama.
  string request_id = 2;
}

message CancelProcessInstanceResponse {}

message ListProcessInstanceRecordsRequest {
  string process_instance_key = 1;
  // Default 100, maksimum 500.
  int32 page_size = 2;
  // Token opak dari respons sebelumnya.
  string page_token = 3;
}

message ExecutionRecord {
  // Urutan per instance, mulai 1, tanpa celah.
  int32 sequence = 1;
  string record_key = 2;
  string value_type = 3;
  string intent = 4;
  string element_id = 5;
  // Payload record dalam JSON.
  string payload = 6;
  google.protobuf.Timestamp timestamp = 7;
}

message ListProcessInstanceRecordsResponse {
  repeated ExecutionRecord records = 1;
  string next_page_token = 2;
}

message ListElementInstancesRequest {
  string process_instance_key = 1;
  // Hanya element instance yang belum final.
  bool only_active = 2;
  // Default 100, maksimum 500.
  int32 page_size = 3;
  string page_token = 4;
}

message ListElementInstancesResponse {
  repeated ElementInstance element_instances = 1;
  string next_page_token = 2;
}
