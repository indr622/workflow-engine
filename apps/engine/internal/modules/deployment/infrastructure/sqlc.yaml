version: '2'
sql:
  - engine: postgresql
    schema: ../../../platform/db/migrations
    queries: queries
    gen:
      go:
        package: db
        out: db
        sql_package: pgx/v5
        emit_methods_with_db_argument: false
        emit_pointers_for_null_types: true
        emit_result_struct_pointers: false
        overrides:
          - db_type: uuid
            go_type: string
